name: Docker image (tavern)

# The commit of dsh-tavern that is built is the one in docker-tavern/TAVERN_COMMIT.
on:
  push:
    branches: [master]
    paths:
      - docker-tavern/**
      - '!docker-tavern/**.md'
      - .github/workflows/docker-tavern-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-tavern-image
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'pandyzhou/deepseek-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/pandyzhou/dsh-tavern
      TAVERN_REPOSITORY: flizzywine/dsh-tavern
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docker-tavern

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: docker-tavern
          load: true
          build-args: TAVERN_REPOSITORY=${{ env.TAVERN_REPOSITORY }}
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha,scope=tavern
          cache-to: type=gha,mode=max,scope=tavern

      - name: Read what the image carries
        id: seed
        run: |
          docker run --rm --entrypoint cat "$IMAGE:test" /opt/dsh-tavern/seed.json > seed.json
          cat seed.json
          commit="$(jq -r .commit seed.json)"
          test "$commit" = "$(tr -d '[:space:]' < docker-tavern/TAVERN_COMMIT)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version seed.json)" >> "$GITHUB_OUTPUT"
          echo "dsh=$(jq -r .dsh seed.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .version seed.json)-$(printf '%s' "$commit" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Run it the way it is deployed
        env:
          COMMIT: ${{ steps.seed.outputs.commit }}
        run: bash docker-tavern/smoke-test.sh "$IMAGE:test" "$TAVERN_REPOSITORY" "$COMMIT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: docker-tavern
          push: true
          build-args: TAVERN_REPOSITORY=${{ env.TAVERN_REPOSITORY }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.seed.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/pandyzhou/deepseek-harness
            org.opencontainers.image.description=DSH Tavern ${{ steps.seed.outputs.version }} (flizzywine/dsh-tavern at ${{ steps.seed.outputs.commit }} with the fixes listed in docker-tavern/README.md, AGPL-3.0) with DeepSeek Harness ${{ steps.seed.outputs.dsh }} (MIT)
          cache-from: type=gha,scope=tavern

# An example. Put a reverse proxy with HTTPS in front of 127.0.0.1:10444, set
# up as openresty.conf says: plain HTTP behind it, the Host header passed on
# unchanged, WebSocket upgrades passed on. Opening the address then shows the
# login page.
services:
  dsh-tavern:
    image: ghcr.io/pandyzhou/dsh-tavern:latest
    container_name: dsh-tavern
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DSH_PUBLIC_URL: https://tavern.example.com/
      DSH_LOGIN_USER: tavern
      # To be filled in: the container does not start without one. Whoever
      # knows it can run commands in the container, so make it a long one.
      DSH_LOGIN_PASSWORD: ''
    ports:
      - "127.0.0.1:10444:3081"
    volumes:
      - ./data:/data

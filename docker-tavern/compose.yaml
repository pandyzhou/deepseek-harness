# An example. Put a reverse proxy with HTTPS in front of 127.0.0.1:10444: plain
# HTTP behind it, the Host header passed on unchanged, WebSocket upgrades
# passed on. The login link, with its token, is in `docker logs dsh-tavern`.
#
# With an account and a password checked by the reverse proxy instead of that
# link, set it up as openresty.conf says and take the two lines marked below in.
services:
  dsh-tavern:
    image: ghcr.io/pandyzhou/dsh-tavern:latest
    container_name: dsh-tavern
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DSH_PUBLIC_URL: https://tavern.example.com/
      # DSH_TAVERN_LOGIN_PORT: 3082       # for openresty.conf
    ports:
      - "127.0.0.1:10444:3081"
      # - "127.0.0.1:10445:3082"          # for openresty.conf
    volumes:
      - ./data:/data

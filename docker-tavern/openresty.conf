# The site of the tavern in OpenResty or nginx: nothing but passing requests
# on, since the login page is the image's own. The build runs this file in
# front of the image and a browser through it (smoke-test.sh), with only the
# port and the paths replaced.
#
# The container is started with DSH_PUBLIC_URL set to the address of this
# site, and its port published on this machine alone: 127.0.0.1:10444 -> 3081.

map $http_upgrade $tavern_connection {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name tavern.example.com;
    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    # Cards and their pictures are uploaded whole.
    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:10444;
        proxy_http_version 1.1;
        # The name as the browser sent it: the tavern refuses any other.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tavern_connection;
        # Answers are streamed, over connections that stay open.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

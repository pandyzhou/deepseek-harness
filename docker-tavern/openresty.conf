# The site of the tavern in OpenResty or nginx, with an account and a password
# checked here. The build runs this file in front of the image and a browser
# through it (smoke-test.sh), with only the names, ports and paths replaced.
#
# The container is started with DSH_PUBLIC_URL set to the address of this site
# and DSH_TAVERN_LOGIN_PORT set to 3082, its ports published on this machine
# alone: 127.0.0.1:10444 -> 3081 (the tavern), 127.0.0.1:10445 -> 3082 (the
# login helper).
#
# Three things happen here beyond passing requests on:
#
# 1. Every request needs the password, but for the two kinds below.
# 2. What the tavern itself serves without a login goes without the password
#    as well. Character cards are drawn in frames that the browser keeps apart
#    from the page, and it sends neither the password nor a cookie with what
#    they fetch.
# 3. A browser that has given the password and is not yet logged in to the
#    tavern is logged in by the login helper, so the link in the log of the
#    container is not needed.

map $http_upgrade $tavern_connection {
    default upgrade;
    ''      close;
}

# The opening of a WebSocket goes without the password: not every browser
# sends it there. The tavern checks its own login cookie on each of them.
map $http_upgrade $tavern_password {
    default        "DSH Tavern";
    ~*^websocket$  off;
}

server {
    listen 443 ssl;
    server_name tavern.example.com;
    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    auth_basic           $tavern_password;
    auth_basic_user_file /path/to/tavern.htpasswd;

    # Cards and their pictures are uploaded whole.
    client_max_body_size 300m;

    proxy_http_version 1.1;
    # The name as the browser sent it: the tavern refuses any other.
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tavern_connection;
    # Answers are streamed, over connections that stay open.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location / {
        proxy_pass http://127.0.0.1:10444;
    }

    # The page. When the tavern answers 401 here, the password was right and
    # the browser has no cookie of the tavern yet: the login helper sends it on
    # to the login link. A wrong password never gets that far, since the named
    # location asks for it again.
    location = / {
        proxy_pass http://127.0.0.1:10444;
        proxy_intercept_errors on;
        error_page 401 = @tavern_login;
    }

    location @tavern_login {
        proxy_pass http://127.0.0.1:10445;
    }

    # What the tavern serves without its own login: reading these goes without
    # the password, anything else on them asks for it.
    location ~ ^/(version$|api/dsh-tavern/(static-assets$|session-resource$|helper-history$|remote-assets/|vendor/|client-assets/|plugin-assets/)) {
        auth_basic off;
        limit_except GET HEAD {
            auth_basic           "DSH Tavern";
            auth_basic_user_file /path/to/tavern.htpasswd;
        }
        proxy_pass http://127.0.0.1:10444;
    }
}

# An example. Put a reverse proxy with HTTPS in front of 127.0.0.1:10443
# (plain HTTP). The login link, with its token, is in `docker logs dsh`.
services:
  dsh:
    image: ghcr.io/pandyzhou/dsh:latest
    container_name: dsh
    restart: unless-stopped
    environment:
      DSH_TRUSTED_HOSTS: dsh.example.com
      DSH_PUBLIC_URL: https://dsh.example.com/
    ports:
      - "127.0.0.1:10443:3080"
    volumes:
      - ./data/dsh:/data/dsh
      - ./data/workspace:/workspace
